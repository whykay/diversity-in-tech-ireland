  - name: "CloseTheGap Launch @ Royal Irish Academy"
    url: "https://lnkd.in/p/eW5h3MfY"
    region: 🇮🇪
    date_added: 2026-11-02
    start_datetime: 2026-11-16T18:00:00Z
    end_datetime: 2026-11-16T20:00:00Z
    new: true
    recurring: true
    desc: "<p>CloseTheGap: a coalition of experts working to close the gaps women face across a lifetime. That covers pay and pensions, maternity and return to work, and representation in industries where women are still underrepresented. PayGap.ie is the data. CloseTheGap is what we'll do with it.</p>
     <p>At the launch we’ll also release our report on the state of pay in Ireland, five years into pay gap reporting. It draws on years of PayGap.ie data and asks what the numbers tell us, and what we should do next.</p>"
